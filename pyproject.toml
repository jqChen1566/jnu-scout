[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jnuscout"
version = "0.1.0"
description = "The machine-learning-potential scout for reaction path search"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Jianqi Chen" },
  { name = "Juan Li" },
]
keywords = [
  "reaction path search",
  "neural network potential",
  "machine learning potential",
  "AFIR",
  "SCINE",
  "uncertainty quantification",
  "computational chemistry",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
  "ase>=3.22",
  "numpy>=1.24",
]

[project.optional-dependencies]
nnp = [
  "torch>=2.0",
  "mace-torch",
  "aimnet2",
]
scine = [
  "scine-utilities",
  "scine-chemoton",
  "scine-database",
  "scine-puffin",
]
dev = [
  "pytest>=7",
]

[project.urls]
Homepage = "https://github.com/jqChen1566/jnu-scout"
Repository = "https://github.com/jqChen1566/jnu-scout"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
